# Hyprpaper configuration
# New block-based syntax for Hyprland updates
# Monitor names can be found using: hyprctl monitors

wallpaper {
    monitor = DP-1
    path = /home/patty/Pictures/Wallpapers/wallpaper8.png
    fit_mode = cover
}

wallpaper {
    monitor = HDMI-A-2
    path = /home/patty/Pictures/Wallpapers/wallpaper8.png
    fit_mode = cover
}

splash=false
